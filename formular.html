<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontaktný formulár | Basicweb</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="border-bottom py-3"><nav class="navbar navbar-expand-lg p-0" aria-label="Hlavná navigácia">
      <a class="navbar-brand logo" href="index.html">BASICWEB</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-label="Otvoriť navigáciu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="main-nav"><ul class="navbar-nav ms-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Domov</a></li><li class="nav-item"><a class="nav-link" href="kontakty.html">Kontakty</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="formular.html">Formulár</a></li><li class="nav-item"><a class="nav-link" href="galeria.html">Galéria</a></li><li class="nav-item"><a class="nav-link" href="tabulka.html">Prehľad</a></li>
      </ul></div>
    </nav></header>
    <main class="row g-5 py-5 py-lg-6"><section class="col-lg-5"><p class="eyebrow">Napíš mi</p><h1 class="display-title">Ozvi sa.</h1><p class="lead intro">Máš otázku, nápad alebo chceš začať spoluprácu? Vyplň krátky formulár a ja sa ti ozvem.</p></section>
      <form class="col-lg-7 contact-form" action="mailto:ahoj@basicweb.sk" method="post" enctype="text/plain">
        <div class="mb-3"><label class="form-label" for="meno">Meno</label><input class="form-control" type="text" id="meno" name="meno" autocomplete="name" required></div>
        <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="mb-3"><label class="form-label" for="vek">Vek</label><input class="form-control" type="number" id="vek" name="vek" min="1" max="120" required></div>
        <div class="mb-3"><label class="form-label" for="heslo">Heslo</label><input class="form-control" type="password" id="heslo" name="heslo" autocomplete="new-password" required></div>
        <div class="mb-3"><label class="form-label" for="termin">Preferovaný termín</label><input class="form-control" type="date" id="termin" name="termin" required></div>
        <div class="mb-4"><label class="form-label" for="sprava">Správa</label><textarea class="form-control" id="sprava" name="sprava" rows="5" required></textarea></div>
        <button class="btn btn-accent" type="submit">Odoslať správu</button>
      </form>
    </main>
    <footer class="border-top py-4 text-muted">Odpovedám zvyčajne do dvoch pracovných dní.</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
